---
lez_domain: '{{ stage }}net.lez.logos.co'
lez_service_name: 'logos-exec-zone'
lez_explorer_cont_port: 8081
lez_blockchain_cont_api_port: 8080
lez_blockchain_cont_swarm_port: 3000
lez_sequencer_config: '{{ lookup("ansible.builtin.file", "../files/lez/"+stage+"/sequencer_config.json") | mandatory }}'
lez_indexer_config:   '{{ lookup("ansible.builtin.file", "../files/lez/"+stage+"/indexer_config.json") | mandatory }}'
# FIXME: Unknown reason why we can't use logos_node_blockchain_initial_peers_env[stage].
lez_blockchain_initial_peers:
  - '--net-initial-peers=/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar'
  - '--net-initial-peers=/ip4/65.109.51.37/udp/3001/quic-v1/p2p/12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz'
  - '--net-initial-peers=/ip4/65.109.51.37/udp/3002/quic-v1/p2p/12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb'
  - '--net-initial-peers=/ip4/65.109.51.37/udp/3003/quic-v1/p2p/12D3KooWAnriLgXyQnGTYz1zPWPkQL3rthTKYLzuAP7MMnbgsxzR'
  - '--net-initial-peers=/ip4/65.109.51.37/udp/50001/quic-v1/p2p/12D3KooWSQc7CcGtvWDPF1yCbBthFnQjprfCVHmfmNDUrSmqQsU1'

# Certbot
certbot_docker_enabled: true
certbot_admin_email: 'devops@status.im'
certbot_services_to_stop: ['nginx']
certbot_certs:
  - domains:
      - '{{ lez_domain }}'

# Nginx
nginx_sites:
  chat_kc_https:
    - listen 443 ssl
    - server_name {{ lez_domain }}

    - ssl_certificate     /etc/letsencrypt/live/{{ lez_domain }}/fullchain.pem
    - ssl_certificate_key /etc/letsencrypt/live/{{ lez_domain }}/privkey.pem

    - location / {
        proxy_pass http://localhost:{{ lez_explorer_cont_port }}/;
      }

# Firewall
open_ports_list:
  nginx:
    - { port: [80, 443], proto: 'tcp', comment: 'Nginx' }
  logos-blockchain:
    - { port: '{{ lez_blockchain_cont_swarm_port }}', proto: tcp, comment: 'Logos Blockchain Swarm' }
